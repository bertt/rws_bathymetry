[workspace]
resolver = "2"
members = ["crates/bathy-core", "crates/bathy-qm", "crates/bathy-terrarium", "crates/bathy-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
terrio = { version = "0.9", default-features = false, features = ["geotiff", "remote"] }
anyhow = "1"
flate2 = "1"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
